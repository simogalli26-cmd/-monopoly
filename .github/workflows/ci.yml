name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:portal
      - name: Upload portal build (for CrazyGames / Poki)
        uses: actions/upload-artifact@v6
        with:
          name: metropoly-portal
          path: dist/portal
